# Business types, creation costs and which types require a government license.
creation-costs:
  FARM: 25000
  FACTORY: 100000
  DEALERSHIP: 150000
  SHOP: 20000
  FOOD_COMPANY: 40000
  JEWELRY_STORE: 75000
  BANK: 500000
  MINE: 300000

# These business types can only be created (and access discounted government
# stock) with a license issued by the government module.
license-required:
  - FACTORY
  - FOOD_COMPANY
  - DEALERSHIP
  - JEWELRY_STORE

# Factory recipes: consume raw materials and produce a tagged product which
# can be sold to the government at a fixed price.
factory-recipes:
  jewelry:
    display: "&eJewelry"
    inputs:
      GOLD_INGOT: 4
      DIAMOND: 1
    output: GOLD_INGOT
    output-amount: 1
    government-price: 3500
  watch:
    display: "&fWatch"
    inputs:
      GOLD_INGOT: 6
      CLOCK: 1
    output: CLOCK
    output-amount: 1
    government-price: 5000
  steel:
    display: "&7Steel"
    inputs:
      IRON_INGOT: 8
      COAL: 4
    output: IRON_INGOT
    output-amount: 8
    government-price: 1600
  car-parts:
    display: "&bCar Parts"
    inputs:
      IRON_INGOT: 16
      REDSTONE: 2
    output: IRON_BLOCK
    output-amount: 1
    government-price: 6000

# Farms produce these items on /farm harvest and sell them to the government
# at the fixed prices below.
farm:
  harvest:
    WHEAT: 16
    CARROT: 16
    POTATO: 16
    BREAD: 4
  government-price:
    WHEAT: 4
    CARROT: 5
    POTATO: 5
    BREAD: 25

# Discounted government stock. Only licensed businesses of the listed types
# may buy it at wholesale; dealerships then resell to players at retail.
government-stock:
  food-basket:
    display: "&6Government Food Basket"
    item: BREAD
    amount: 32
    wholesale: 800
    requires: [FOOD_COMPANY, SHOP]
  sedan:
    display: "&7Standard Sedan"
    item: SADDLE
    amount: 1
    wholesale: 25000
    retail: 32000
    requires: [DEALERSHIP]
  suv:
    display: "&2Off-Road SUV"
    item: SADDLE
    amount: 1
    wholesale: 40000
    retail: 52000
    requires: [DEALERSHIP]

# Supply shop catalogs per business type. Each item can be bought at a
# discounted rate by licensed business owners. max-stock is the restock
# limit (resets on restock cycle). Admins manage these through the
# /business admin supply command.
supply-catalog:
  SHOP:
    bread:
      display: "&6Bread"
      item: BREAD
      price: 5
      max-stock: 100
    cooked_beef:
      display: "&6Cooked Beef"
      item: COOKED_BEEF
      price: 12
      max-stock: 50
    golden_apple:
      display: "&6Golden Apple"
      item: GOLDEN_APPLE
      price: 200
      max-stock: 10
  FOOD_COMPANY:
    bread:
      display: "&6Bread"
      item: BREAD
      price: 3
      max-stock: 200
    cooked_beef:
      display: "&6Cooked Beef"
      item: COOKED_BEEF
      price: 8
      max-stock: 100
    cooked_porkchop:
      display: "&6Cooked Porkchop"
      item: COOKED_PORKCHOP
      price: 10
      max-stock: 80
    cake:
      display: "&6Cake"
      item: CAKE
      price: 50
      max-stock: 20
  FACTORY:
    iron_ingot:
      display: "&7Iron Ingot"
      item: IRON_INGOT
      price: 150
      max-stock: 64
    coal:
      display: "&7Coal"
      item: COAL
      price: 30
      max-stock: 128
    redstone:
      display: "&cRedstone"
      item: REDSTONE
      price: 80
      max-stock: 64
  DEALERSHIP:
    saddle:
      display: "&7Saddle"
      item: SADDLE
      price: 500
      max-stock: 10
    name_tag:
      display: "&6Name Tag"
      item: NAME_TAG
      price: 300
      max-stock: 20
  JEWELRY_STORE:
    gold_ingot:
      display: "&6Gold Ingot"
      item: GOLD_INGOT
      price: 400
      max-stock: 32
    diamond:
      display: "&bDiamond"
      item: DIAMOND
      price: 2000
      max-stock: 10
  MINE:
    iron_pickaxe:
      display: "&7Iron Pickaxe"
      item: IRON_PICKAXE
      price: 200
      max-stock: 20
    torch:
      display: "&6Torch"
      item: TORCH
      price: 2
      max-stock: 256
