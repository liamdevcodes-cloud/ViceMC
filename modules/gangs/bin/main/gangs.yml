# Two fixed gangs: North Side and South Side. These are the only gangs on the
# server and cannot be changed. Each has its own home territory.
gangs:
  north:
    name: "&bNorth Side"
    region-tag: "gang:north"
    drug-material: SUGAR
    drug-name: "&bIce"
    drug-effect: SPEED
    drug-amplifier: 2
    drug-duration-seconds: 60
  south:
    name: "&dSouth Side"
    region-tag: "gang:south"
    drug-material: SUGAR
    drug-name: "&5Meth"
    drug-effect: HASTE
    drug-amplifier: 3
    drug-duration-seconds: 45

# Weekly election. During the window members vote via /gang vote; the member
# with the most votes becomes the leader of the gang for the week.
election:
  day: SUNDAY
  hour: 12
  window-hours: 24

# How many drugs a member may claim per week once their gang controls a
# contested territory.
weekly-drugs: 5

# Neutral street zones both gangs fight over with stand-and-hold capture. Each
# zone needs a region defined in game: /vregion pos1 + /vregion pos2 +
# /vregion create <id> <region-tag>. The gang with more members inside than the
# other fills the capture bar; at 100% the zone flips to that gang and unlocks
# their weekly drug booster.
territories:
  market-strip:
    name: "&eMarket Strip"
    region-tag: "gangzone:market"
    capture-seconds: 60
  factory-zone:
    name: "&7Factory Zone"
    region-tag: "gangzone:factory"
    capture-seconds: 90
  docks:
    name: "&9Docks"
    region-tag: "gangzone:docks"
    capture-seconds: 90

# How often the capture bar ticks (seconds).
capture:
  tick-seconds: 5
