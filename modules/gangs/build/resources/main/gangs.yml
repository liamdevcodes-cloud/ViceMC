# Two fixed factions: North Side and South Side.
# Maximum member difference between gangs is 4 (balancing enforced on join).
gangs:
  north:
    name: "&bNorth Side"
    region-tag: "gang:north"
    drug-material: SUGAR
    drug-name: "&bIce"
    drug-effect: SPEED
    drug-amplifier: 2
    drug-duration-seconds: 60
  south:
    name: "&dSouth Side"
    region-tag: "gang:south"
    drug-material: SUGAR
    drug-name: "&5Meth"
    drug-effect: HASTE
    drug-amplifier: 3
    drug-duration-seconds: 45

# Biweekly leader election. Every 2 weeks on the specified day, members vote.
# Kill stats during the term are shown next to candidates.
election:
  day: SATURDAY
  hour: 12
  window-hours: 24
  every-weeks: 2

# Scheduled territory war window (server timezone: Europe/Berlin / CET+CEST).
# During this window, capturing a territory rewards the gang's bank.
# Admins can also toggle wars manually with /gang togglewar.
war:
  start-day: FRIDAY
  end-day: SUNDAY
  start-hour: 20
  end-hour: 23

# How many drugs a member may claim per week once their gang controls territory.
weekly-drugs: 5

# Contested zones both gangs fight over. During war events, capturing a zone
# rewards money and weapons to the capturing gang's bank.
# Each zone needs a region defined: /vregion pos1 + pos2 + create <id> <region-tag>
territories:
  market-strip:
    name: "&eMarket Strip"
    region-tag: "gangzone:market"
    capture-seconds: 60
    reward-money: 500
    reward-guns: 2
  factory-zone:
    name: "&7Factory Zone"
    region-tag: "gangzone:factory"
    capture-seconds: 90
    reward-money: 750
    reward-guns: 3
  docks:
    name: "&9Docks"
    region-tag: "gangzone:docks"
    capture-seconds: 90
    reward-money: 1000
    reward-guns: 4

# How often the capture bar ticks (seconds).
capture:
  tick-seconds: 5
