# ========================================
# Vice Transport - Teleporter Configuration
# ========================================
#
# How it works:
#   1. Admin places the pad block (default: lodestone)
#   2. A pressure plate auto-spawns on top + a wall sign 2 blocks up
#   3. /transport give -> get the wand
#   4. Right-click source pad -> right-click destination pad
#   5. Type a route name in chat
#   6. Player steps on the plate -> darkness + boss bar countdown -> teleport
#
# Commands:
#   /transport give    - Get the transport wand
#   /transport wand    - Alias for /give
#   /transport list    - List all teleporters
#   /transport unlink  - Look at a pad and run to break its link
#   /transport reload  - Reload this config
#
# Permissions:
#   vicemc.transport.admin  - Place pads, use wand, admin commands
#   vicemc.transport.use    - Step on plates to teleport

# =====================
#  Block Configuration
# =====================

# The teleporter pad block that admins place
pad-block: LODESTONE

# Weighted pressure plate placed on top of the pad
# Options: LIGHT_WEIGHTED_PRESSURE_PLATE, HEAVY_WEIGHTED_PRESSURE_PLATE,
#          STONE_PRESSURE_PLATE, OAK_PRESSURE_PLATE, etc.
plate-block: HEAVY_WEIGHTED_PRESSURE_PLATE

# Wall sign material (attached to a backing block above the pad)
# Options: OAK_WALL_SIGN, SPRUCE_WALL_SIGN, BIRCH_WALL_SIGN, JUNGLE_WALL_SIGN,
#          ACACIA_WALL_SIGN, DARK_OAK_WALL_SIGN, MANGROVE_WALL_SIGN,
#          CRIMSON_WALL_SIGN, WARPED_WALL_SIGN, POLISHED_BLACKSTONE_WALL_SIGN, etc.
sign-block: OAK_WALL_SIGN

# Solid block placed behind the wall sign as a backing
# Options: STONE_BRICKS, COBBLESTONE, OBSIDIAN, DEEPSLATE_BRICKS, etc.
backing-block: STONE_BRICKS

# =====================
#  Teleport Settings
# =====================

# Default price for newly linked teleporters (0 = free)
default-price: 0

# Default travel time in seconds (countdown duration)
default-travel-time: 5

# =====================
#  Sign Templates
# =====================
# Use %name%, %price%, %travel% as placeholders
# Use & for color codes

# Line 1 of the wall sign (header)
sign-prefix: "&6&l[TELEPORT]"

# Line 2 template (route name)
sign-line2-template: "&f%name%"

# Line 3 template (price)
sign-line3-template: "&a%price%"

# Line 4 template (travel time)
sign-line4-template: "&7%travel%s trip"

# =====================
#  Boss Bar Settings
# =====================

# Boss bar title during countdown (use %name% for route name)
bossbar-title: "&eTeleporting to &f%name%"

# Boss bar color: BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
bossbar-color: RED

# =====================
#  Messages
# =====================

link-confirm: "&7Price: &f%price% &7| Travel time: &f%travel%s"

# =====================
#  Teleporter Data
# =====================
# Managed automatically by the wand. Edit manually if needed.
teleporters: {}
